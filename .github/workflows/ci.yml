name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, typecheck, test, web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test -- --ci
      - name: Build web
        run: npm run build:web

  database:
    name: Database (migrations, seed, RLS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start Supabase (applies migrations and seed)
        run: npx supabase start -x storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit,realtime
      - name: Lint schema
        run: npx supabase db lint --fail-on error
      - name: RLS tests
        run: npx supabase test db
      - name: Generated types are up to date
        run: |
          npx supabase gen types typescript --local > src/lib/database.types.ts
          git diff --exit-code src/lib/database.types.ts

  # The original game is a separate web build (games/ringward). It runs in parallel with the app
  # and database jobs, so it doesn't make them slower. It isn't a required check.
  game:
    name: Game (Ringward typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/ringward
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: games/ringward/package-lock.json
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build (typecheck + Vite)
        run: npm run build

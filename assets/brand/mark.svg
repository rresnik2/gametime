<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -100 200 200" width="1024" height="1024">
  <title>GameTime mark</title>
  <!--
    GameTime mark: a live dot whose pulse ring is a play button.
    Source of truth for every generated icon (npm run icons). Keep the ids:
    scripts/generate-icons.mjs reads the geometry of #play and #live from this file.
    Play: equilateral triangle, centroid (0,0), circumradius 100, corner radius 18,
    with a 31-unit hole around the centroid. Live dot: radius 22 at the centroid.
    The viewBox centres the mark optically (between the centroid and the bounding box).
  -->
  <path id="play" fill="#7C5CFF" fill-rule="evenodd"
    d="M73 -15.59A18 18 0 0 1 73 15.59L-23 71.01A18 18 0 0 1 -50 55.43L-50 -55.43A18 18 0 0 1 -23 -71.01Z M31 0A31 31 0 1 0 -31 0A31 31 0 1 0 31 0Z"/>
  <circle id="live" fill="#FF3B5C" cx="0" cy="0" r="22"/>
</svg>
